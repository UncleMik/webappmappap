server {
    listen 80;
    server_name 129.101.119.250;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://129.101.119.250$request_uri; }
}

server {
    listen 443 ssl;
    server_name 129.101.119.250;
    ssl_certificate /etc/letsencrypt/live/wep-pril-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wep-pril-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/wep_pril/frontend;
    index index.html;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ~ ^/uploads/articles/[a-z0-9-]+\.webp$ {
        root /opt/wep_pril;
        add_header Access-Control-Allow-Origin https://unclemik.github.io always;
        add_header X-Content-Type-Options nosniff always;
        expires 30d;
    }
    location ~ ^/uploads/weekly/[a-f0-9]{64}\.webp$ {
        root /opt/wep_pril;
        add_header Access-Control-Allow-Origin https://unclemik.github.io always;
        add_header X-Content-Type-Options nosniff always;
        expires 30d;
    }
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ \.(html|css|js|png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
