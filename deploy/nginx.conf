# Admin is hosted on this HTTPS IP. Legacy participant links use the school domain.
server {
    listen 80;
    server_name 129.101.119.250;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location = /admin { return 308 https://129.101.119.250/admin; }
    location ^~ /admin/ { return 308 https://129.101.119.250$request_uri; }
    location ^~ /api/admin/ { return 404; }
    location / { return 302 https://app.legkie-rody.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name 129.101.119.250;
    ssl_certificate /etc/letsencrypt/live/wep-pril-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wep-pril-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "no-store" always;
    location = /admin { include /etc/nginx/snippets/wep-pril-admin-proxy.conf; }
    location ^~ /admin/ { include /etc/nginx/snippets/wep-pril-admin-proxy.conf; }
    location ^~ /api/admin/ { include /etc/nginx/snippets/wep-pril-admin-proxy.conf; }
    location / { return 302 https://app.legkie-rody.ru$request_uri; }
}
