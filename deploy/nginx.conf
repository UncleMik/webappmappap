# Legacy IP links converge on the origin that owns the account session.
server {
    listen 80;
    server_name 129.101.119.250;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 302 https://app.legkie-rody.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name 129.101.119.250;
    ssl_certificate /etc/letsencrypt/live/wep-pril-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wep-pril-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "no-store" always;
    return 302 https://app.legkie-rody.ru$request_uri;
}
