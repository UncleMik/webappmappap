server {
    listen 80;
    server_name app.legkie-rody.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://app.legkie-rody.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name app.legkie-rody.ru;
    ssl_certificate /etc/letsencrypt/live/wep-pril-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wep-pril-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/wep_pril/frontend;
    index index.html;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;

    # Every request is protected unless explicitly needed to sign in.
    auth_request /__account_check;
    location = /__account_check {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:3001/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location = /login.html {
        auth_request off;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/(register|forgot-password|reset-password)\.html$ {
        auth_request off;
        return 302 /login.html;
    }
    location ~ ^/(auth\.css|login\.css|login\.js|auth-client\.js|auth-return\.js|auth-gate\.js|profile-dates\.js|assets/auth-mother\.png|assets/fonts/Intro-(Regular|Bold|Black)\.woff)$ {
        auth_request off;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location @sign_in {
        auth_request off;
        add_header Cache-Control "no-store" always;
        return 302 "/login.html#next=$request_uri";
    }
    location ~ \.html$ {
        error_page 401 = @sign_in;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/auth/personal {
        auth_request off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/auth/profile-photo {
        auth_request off;
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/auth/club/messages {
        auth_request off;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/auth/ {
        auth_request off;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        add_header Cache-Control "private, no-store" always;
    }
    location ~ ^/uploads/articles/[a-z0-9-]+\.webp$ {
        root /opt/wep_pril;
        add_header Access-Control-Allow-Origin https://unclemik.github.io always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }
    location ~ "^/uploads/weekly/[a-f0-9]{64}\.webp$" {
        root /opt/wep_pril;
        add_header Access-Control-Allow-Origin https://unclemik.github.io always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }
    location = / {
        error_page 401 = @sign_in;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ \.(html|css|js|png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
