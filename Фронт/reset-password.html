<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdfd">
  <title>Новый пароль — Лёгкие роды</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <header class="auth-brand">Лёгкие роды <span class="auth-brand-heart" aria-hidden="true">♥</span></header>
    <a class="auth-back" href="forgot-password.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 4-8 8 8 8M5 12h16"/></svg>Назад</a>
    <main class="auth-main auth-main--recovery">
      <h1 class="auth-title">Новый пароль</h1>
      <p class="auth-subtitle">Придумайте новый пароль для аккаунта</p>
      <form class="auth-form" data-auth-form="reset">
        <div class="auth-field">
          <label for="password">Новый пароль</label>
          <div class="auth-input-wrap">
            <input class="auth-input" id="password" name="password" type="password" placeholder="Введите новый пароль" autocomplete="new-password" minlength="8" required data-new-password>
            <button class="auth-eye" type="button" data-password-toggle aria-controls="password" aria-label="Показать пароль" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-5 10-5 10 5 10 5-3.5 5-10 5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
          </div>
        </div>
        <div class="auth-field">
          <label for="password-confirm">Повторите пароль</label>
          <div class="auth-input-wrap">
            <input class="auth-input" id="password-confirm" name="password-confirm" type="password" placeholder="Введите пароль ещё раз" autocomplete="new-password" minlength="8" required data-confirm-password>
            <button class="auth-eye" type="button" data-password-toggle aria-controls="password-confirm" aria-label="Показать пароль" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-5 10-5 10 5 10 5-3.5 5-10 5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
          </div>
        </div>
        <button class="auth-button" type="submit">Сохранить пароль</button>
        <p class="auth-status" role="status" aria-live="polite" data-auth-status></p>
      </form>
      <p class="auth-preview">Предпросмотр — пароль пока не сохраняется.</p>
    </main>
  </div>
</body>
</html>
