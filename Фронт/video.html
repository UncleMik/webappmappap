<body class="video-page">
  <div class="app video-app" data-video-pending>
    <header class="video-header">
      <a class="video-back" href="mom.html" aria-label="Вернуться назад"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
      <div><h1 id="video-title">Видео</h1><p>Видео · <span id="video-duration"></span></p></div>
      <button class="video-favorite" type="button" aria-label="Добавить в избранное" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3 12C-3 4 8 0 12 7 16 0 27 4 21 12Z"/></svg></button>
    </header>
    <main class="video-main">
      <section class="video-stage" aria-label="Видеоплеер">
        <div id="youtube-player"></div>
        <button class="video-cover" type="button" aria-label="Включить видео">
          <img hidden alt="">
          <span class="cover-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 13 8-13 8Z"/></svg></span>
          <span class="cover-label">Смотреть видео</span>
        </button>
        <button id="video-fullscreen" class="video-fullscreen-button" type="button" aria-label="На весь экран" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
        </button>
        <p id="video-rotate-hint" class="video-rotate-hint" role="status" hidden>Поверните телефон для горизонтального просмотра</p>
        <div class="video-fullscreen-tools" hidden></div>
      </section>
      <section class="video-panel" aria-labelledby="step-title">
        <div class="video-timeline"><input id="video-progress" type="range" min="0" max="100" value="0" step="1" aria-label="Позиция в видео" disabled><output id="video-time">0:00</output></div>
        <div class="video-controls">
          <button id="video-prev" class="skip-button" type="button" aria-label="Предыдущий раздел" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h3v14H5zm14 0v14L8 12Z"/></svg></button>
          <button id="video-play" class="play-button" type="button" aria-label="Воспроизвести видео"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="m8 4 13 8-13 8Z"/></svg></button>
          <button id="video-next" class="skip-button" type="button" aria-label="Следующий раздел"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h3v14h-3zM5 5l11 7-11 7Z"/></svg></button>
        </div>
        <div class="step-copy" aria-live="polite"><p class="step-count"></p><h2 id="step-title"></h2><p class="step-description"></p></div>
        <aside class="video-note" hidden><span aria-hidden="true">i</span><p></p></aside>
        <p id="player-status" role="status" hidden></p>
        <details class="video-chapters"><summary>Видео <span></span></summary><ol id="chapter-list"></ol></details>
      </section>
    </main>

        <a class="nav-item" href="ai.html"><svg class="nav-icon ai-icon" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4v6a6 6 0 0 0 12 0V4M5 4h3M14 4h3M11 16v4a6 6 0 0 0 12 0v-3"/><circle cx="23" cy="14" r="3"/></svg><span>AI врач</span></a>

        <a class="nav-item" href="profile.html"><svg class="nav-icon profile-icon" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15" cy="9" r="5"/><path d="M5 26v-3a10 10 0 0 1 20 0v3Z"/></svg><span>Профиль</span></a>
