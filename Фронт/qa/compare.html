<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сравнение с эталоном — Сегодня</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#e8e8e8}header{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:8px 12px;border:1px solid #ddd;border-radius:8px;background:white;cursor:pointer}.comparison{position:relative;width:500px;height:956px;background-image:url('../assets/reference.png');background-position:-277px -256px;background-size:1053px 1472px}.comparison iframe{position:absolute;inset:0;border:0;width:100%;height:100%;opacity:.5;pointer-events:none}label{display:flex;gap:8px;align-items:center}</style></head>
<body><header><button data-opacity="0">Эталон</button><button data-opacity="1">Вёрстка</button><button data-opacity="0.5">Наложение 50%</button><label>Прозрачность<input type="range" min="0" max="1" step=".05" value=".5" aria-label="Прозрачность вёрстки"></label></header><div class="comparison"><iframe src="../index.html" title="Вёрстка Сегодня"></iframe></div>
<script>const frame=document.querySelector('iframe');const slider=document.querySelector('input');document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{frame.style.opacity=button.dataset.opacity;slider.value=button.dataset.opacity}));slider.addEventListener('input',()=>frame.style.opacity=slider.value);</script></body></html>
