<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdfd">
  <title>Регистрация — Лёгкие роды</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <header class="auth-brand">Лёгкие роды <span class="auth-brand-heart" aria-hidden="true">♥</span></header>
    <main class="auth-main auth-main--register">
      <h1 class="auth-title">Создать аккаунт</h1>
      <p class="auth-subtitle">Начнём ваш путь вместе</p>
      <form class="auth-form" data-auth-form="register">
        <div class="auth-field">
          <label for="name">Ваше имя</label>
          <input class="auth-input" id="name" name="name" type="text" placeholder="Как к вам обращаться?" autocomplete="given-name" required>
        </div>
        <div class="auth-field">
          <label for="email">Email</label>
          <input class="auth-input" id="email" name="email" type="email" placeholder="example@mail.ru" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Пароль</label>
          <div class="auth-input-wrap">
            <input class="auth-input" id="password" name="password" type="password" placeholder="Минимум 8 символов" autocomplete="new-password" minlength="8" required data-new-password>
            <button class="auth-eye" type="button" data-password-toggle aria-controls="password" aria-label="Показать пароль" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-5 10-5 10 5 10 5-3.5 5-10 5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
          </div>
          <span class="auth-help">Не менее 8 символов</span>
        </div>
        <label class="auth-consent"><input type="checkbox" disabled><span>Принимаю условия и политику конфиденциальности<small>Документы пока готовятся</small></span></label>
        <button class="auth-button" type="submit">Зарегистрироваться</button>
        <p class="auth-status" role="status" aria-live="polite" data-auth-status></p>
      </form>
      <p class="auth-footer">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      <p class="auth-preview">Предпросмотр регистрации — аккаунт пока не создаётся.</p>
    </main>
  </div>
</body>
</html>
