<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdfd">
  <title>Вход — Лёгкие роды</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <header class="auth-brand">Лёгкие роды <span class="auth-brand-heart" aria-hidden="true">♥</span></header>
    <main class="auth-main auth-main--login">
      <img class="auth-illustration" src="assets/auth-mother.png" alt="Мама обнимает малыша">
      <h1 class="auth-title">Рады видеть вас</h1>
      <p class="auth-subtitle">Войдите в свой аккаунт</p>
      <form class="auth-form" data-auth-form="login">
        <div class="auth-field">
          <label for="email">Email</label>
          <input class="auth-input" id="email" name="email" type="email" placeholder="example@mail.ru" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Пароль</label>
          <div class="auth-input-wrap">
            <input class="auth-input" id="password" name="password" type="password" placeholder="Введите пароль" autocomplete="current-password" required>
            <button class="auth-eye" type="button" data-password-toggle aria-controls="password" aria-label="Показать пароль" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-5 10-5 10 5 10 5-3.5 5-10 5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
          </div>
        </div>
        <p class="auth-align-right"><a href="forgot-password.html">Забыли пароль?</a></p>
        <button class="auth-button" type="submit">Войти</button>
        <p class="auth-status" role="status" aria-live="polite" data-auth-status></p>
      </form>
      <p class="auth-footer">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
      <p class="auth-preview">Предпросмотр входа — авторизация пока не подключена.</p>
      <a class="auth-preview-link" href="index.html">Посмотреть приложение</a>
    </main>
  </div>
</body>
</html>
