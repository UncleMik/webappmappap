<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdfd">
  <title>Восстановление пароля — Лёгкие роды</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <header class="auth-brand">Лёгкие роды <span class="auth-brand-heart" aria-hidden="true">♥</span></header>
    <a class="auth-back" href="login.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 4-8 8 8 8M5 12h16"/></svg>Назад</a>
    <main class="auth-main auth-main--recovery">
      <h1 class="auth-title">Забыли пароль?</h1>
      <p class="auth-subtitle">Укажите email для восстановления доступа</p>
      <form class="auth-form" data-auth-form="forgot">
        <div class="auth-field">
          <label for="email">Email</label>
          <input class="auth-input" id="email" name="email" type="email" placeholder="example@mail.ru" autocomplete="email" required>
        </div>
        <button class="auth-button" type="submit">Отправить ссылку</button>
        <p class="auth-status" role="status" aria-live="polite" data-auth-status></p>
      </form>
      <p class="auth-footer"><a href="login.html">Вернуться ко входу</a></p>
      <a class="auth-preview-link" href="reset-password.html">Посмотреть экран нового пароля</a>
    </main>
    <div class="auth-decor" aria-hidden="true"><svg viewBox="0 0 440 210"><path d="M1 203c45-73 90-79 150-57 37 14 70 10 104-10 61-38 120-40 184-8" fill="none" stroke="#F7CDE8" stroke-width="2"/><path d="M245 137c-23-18-37-42-23-51 12-8 22 3 23 13 1-13 13-23 24-15 16 12-1 35-24 53Z" fill="none" stroke="#F4C4E4" stroke-width="2"/><path d="M340 185c-23-48-27-97-3-161M344 161c-29-7-43-30-42-53 26 4 43 23 42 53ZM347 129c29-11 35-39 28-66-24 10-35 30-28 66ZM335 93c-23-9-32-28-29-52 23 8 33 25 29 52Z" fill="#DED4EF"/></svg></div>
  </div>
</body>
</html>
